<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Upload Foto Lawyer</title>

<link
    rel="stylesheet"
    href="../../css/upload.css">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="upload-card">

        <div class="header">

            <h1>

                Upload Foto Advokat

            </h1>

            <p>

                Drag & Drop foto atau klik area di bawah untuk memilih gambar.

            </p>

        </div>

        <div
            id="dropArea"
            class="drop-area">

            <input
                id="fileInput"
                type="file"
                accept="image/*"
                hidden>

            <div
                id="dropContent"
                class="drop-content">

                <i class="fa-solid fa-cloud-arrow-up"></i>

                <h3>

                    Drag & Drop Foto

                </h3>

                <span>

                    atau klik untuk memilih gambar

                </span>

                <small>

                    JPG • PNG • WEBP (Max 5 MB)

                </small>

            </div>

            <div
                id="previewContainer"
                class="preview-container">

                <img
                    id="previewImage">

            </div>

        </div>

        <div
            id="fileInfo"
            class="file-info">

            <div class="file-row">

                <span>

                    Nama File

                </span>

                <strong id="fileName">

                    -

                </strong>

            </div>

            <div class="file-row">

                <span>

                    Ukuran

                </span>

                <strong id="fileSize">

                    -

                </strong>

            </div>

        </div>

        <div class="progress-wrapper">

            <div class="progress">

                <div
                    id="progressBar"
                    class="progress-bar">

                </div>

            </div>

            <span
                id="progressText">

                Belum upload

            </span>

        </div>

        <div class="button-group">

            <button
                id="btnUpload"
                class="btn btn-primary">

                <i class="fa-solid fa-upload"></i>

                Upload

            </button>

            <button
                id="btnReplace"
                class="btn btn-secondary">

                <i class="fa-solid fa-repeat"></i>

                Ganti Foto

            </button>

            <button
                id="btnDelete"
                class="btn btn-danger">

                <i class="fa-solid fa-trash"></i>

                Hapus

            </button>

        </div>

    </div>

</div>

<script src="../../js/upload.js"></script>

</body>

</html>
